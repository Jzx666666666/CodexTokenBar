name: Feature request
description: 提议新功能或改进。请先说明它如何与现有边界兼容。
title: "[Feature] "
labels: [enhancement]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请记得：CodexTokenBar 只读取本地配额，不连接远程端点，也没有长期历史、预测或账户切换。建议的功能请说明是否仍符合这些边界。
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 你想解决哪个具体痛点。
      placeholder: "当配额接近耗尽时，我希望有更明显的提示。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望看到的行为或界面变化。
      placeholder: "在配额低于 10% 时改变圆环颜色。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法，哪怕是临时的。
  - type: checkboxes
    id: hygiene
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 issue，确保没有重复
        - label: 我知道本项目与 OpenAI 无官方关联
        - label: 我已确认该功能不要求连接远程端点
